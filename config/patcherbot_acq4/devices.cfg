# ACQ4 simulated test-pulse, pressure, stage and camera. No vendor device opens.
DAQ:
    driver: 'NiDAQ'
    mock: True
    defaultAIMode: 'NRSE'
    defaultAIRange: [-10, 10]
    defaultAORange: [-10, 10]

Clamp1:
    driver: 'MockClamp'
    simulator: 'neuroanalysis'
    commandChannel:
        device: 'DAQ'
        channel: '/Dev1/ao0'
        type: 'ao'
    primaryChannel:
        device: 'DAQ'
        channel: '/Dev1/ai5'
        mode: 'NRSE'
        type: 'ai'
    icHolding: 0.0
    vcHolding: -65e-3
    testPulse:
        sampleRate: 250000

Manipulator1:
    driver: 'MockStage'
    fastSpeed: 5*mm/s
    slowSpeed: 800*um/s
    isManipulator: True
    scale: 1e-6, 1e-6, 1e-6
    limits:
        x: 0, 20000
        y: 0, 20000
        z: 0, 20000

Stage:
    driver: 'MockStage'
    fastSpeed: 5*mm/s
    slowSpeed: 800*um/s
    scale: 1e-6, 1e-6, 1e-6
    limits:
        x: 0, 20000
        y: 0, 20000
        z: 0, 20000

Pressure1:
    driver: 'MockPressureControl'

Pipette1:
    driver: 'Pipette'
    parentDevice: 'Manipulator1'
    showCameraModuleUI: False
    pitch: 'auto'
    yaw: 'auto'
    searchHeight: 1*mm
    searchTipHeight: 1*mm
    approachHeight: 100*um
    geometry:
        type: 'cone'
        bottom_radius: 1*um
        top_radius: 0.3*mm
        height: 3*mm
        transform:
            angle: 60
            axis: (0, 1, 0)

PatchPipette1:
    driver: 'PatcherBotPatchPipette'
    pipetteDevice: 'Pipette1'
    clampDevice: 'Clamp1'
    pressureDevice: 'Pressure1'

Microscope:
    driver: 'Microscope'
    parentDevice: 'Stage'
    objectives:
        0:
            40x:
                name: '40x simulated objective'
                scale: 1.0 / 40.0
                radius: 12*mm
                offset: 0*um, 0*um

Camera:
    driver: 'MockCamera'
    parentDevice: 'Microscope'
    transform:
        pos: (0, 0)
        scale: (10.203*um/px, -10.203*um/px)
        angle: 0
    defaults:
        exposure: 10*ms
