# Run with: python -m acq4 -x -c config/patcherbot_acq4/default.cfg -m Camera -m PatcherBot
# Install this repository into ACQ4's interpreter first: pip install -e . --no-deps
# This configuration uses ACQ4's simulated hardware; it does not validate a real rig.
imports: ['patcherbot_acq4']
devices: readConfigFile('devices.cfg')
misc:
    patcherbotProfiles: readConfigFile('patchProfiles.cfg')
modules:
    Data Manager:
        module: 'DataManager'
    Camera:
        module: 'Camera'
    MultiPatch:
        module: 'MultiPatch'
        config:
            enableMockPatch: True
    Autopatch:
        module: 'Autopatch'
    PatcherBot:
        module: 'PatcherBotModule'
        config:
            patchPipette: 'PatchPipette1'
            camera: 'Camera'
            # Autopatch must opt into explicit modes; the UI has independent selectors.
            # protocolModes:
            #     find pipette: 'Manual'
            #     approach: 'Classic'
            #     cell detect: 'Classic'
            #     seal: 'Classic'
            #     break in: 'Classic'
            # Uncomment only after providing real checkpoints; missing weights fail closed.
            # detector:
            #     pipetteCheckpoint: '/absolute/path/to/PipetteDetectorNetX.pt'
            #     cellCheckpoint: '/absolute/path/to/segformer_best_map50.pt'
            #     cellEncoderConfig: '/absolute/path/to/config.json'
            #     inputRange: [1000, 4000]  # EXAMPLE ONLY; measure real 16-bit sensor bounds
            # policy:
            #     robomimicRoot: '/absolute/path/to/custom/robomimic-fork'
            #     checkpoints:
            #         find_pipette: '/absolute/path/to/PipetteFinder.pth'
            #         gigaseal: '/absolute/path/to/GigaSealer.pth'
            #         break_in: '/absolute/path/to/Burglar.pth'
            # Continuous acquisition uses REAL NI hardware, not MockClamp/MockNiDAQ.
            # Configure real channel names only on a physical rig and disable the
            # ACQ4 test pulse while it owns the channels.
            # continuous:
            #     daqDevice: 'DAQ'
            #     readChannel: 'cDAQ1Mod1/ai0'
            #     responseChannel: 'cDAQ1Mod1/ai3'
            #     commandChannel: 'cDAQ1Mod4/ao0'
            #     triggerTerminal: '/cDAQ1/ai/StartTrigger'
            #     commandVoltsPerDaqVolt: 0.02
            #     readVoltsPerDaqVolt: 0.02
            #     responseAmpsPerDaqVolt: 2e-9
storageDir: configpath + '/records'
motionPlanner:
    class: 'acq4.motion.DefaultMotionPlanner'
