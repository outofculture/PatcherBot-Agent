# ACQ4 config profiles for only PatcherBotPatchPipette; do not apply to stock ACQ4 pipettes.
# These are source-procedure values, NOT physical-rig or cell-line calibrations.
default:
    find pipette:
        mode: 'Manual'
        toleranceUm: 2.0
        maxMoveStepUm: 100.0
    approach:
        mode: 'Manual'
        cellType: 'Plate'
        cellDistanceUm: 20.0
        sliceStartDistanceUm: 75.0
        maxMoveStepUm: 100.0
    cell detect:
        mode: 'Manual'
        cellRiseMohm: 0.3
        maxDistanceUm: 30.0
        stepUm: 0.4
        maxMoveStepUm: 100.0
    seal:
        mode: 'Manual'
        targetMohm: 1000.0
        minDeltaMohm: 15.0
        deadlineS: 150.0
    break in:
        mode: 'Manual'
        maxAccessMohm: 70.0
